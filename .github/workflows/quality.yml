name: Frontend quality
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      test_repository:
        description: Repository containing the external wish-test suite
        type: string
      test_ref:
        description: Compatible wish-test revision
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: wish-web
    env:
      WISH_WEB_REPO: ${{ github.workspace }}/wish-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: wish-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - uses: actions/checkout@v4
        if: ${{ inputs.test_repository != '' || vars.WISH_TEST_REPOSITORY != '' }}
        with:
          repository: ${{ inputs.test_repository || vars.WISH_TEST_REPOSITORY }}
          ref: ${{ inputs.test_ref || vars.WISH_TEST_REF || 'main' }}
          path: wish-test
      - name: External frontend checks
        if: ${{ inputs.test_repository != '' || vars.WISH_TEST_REPOSITORY != '' }}
        working-directory: wish-test
        run: |
          node web/run.mjs boundaries
          node web/run.mjs typecheck
          node web/run.mjs unit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools brotli numpy
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: pnpm build
      - name: Browser regressions
        if: ${{ inputs.test_repository != '' || vars.WISH_TEST_REPOSITORY != '' }}
        working-directory: wish-test
        env:
          CHROME: /usr/bin/google-chrome
        run: node web/run.mjs browser ci
      - name: External test checkout not configured
        if: ${{ inputs.test_repository == '' && vars.WISH_TEST_REPOSITORY == '' }}
        run: echo '::notice::Set WISH_TEST_REPOSITORY to run the centralized wish-test checks. Only app typecheck, formatting and build ran.'
