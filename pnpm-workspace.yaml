packages:
  - .
storeDir: .cache/pnpm/store
cacheDir: .cache/pnpm/cache
saveExact: true
allowBuilds:
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - motion-v@2.5.0
# Freeze-family fixes: KeepAlive-detach compensation guards, stale-adjustment
# expiry and in-range scroll writes (see ../wish-test/web/frontend/virtual-clamped-adjustment.test.ts).
patchedDependencies:
  '@tanstack/virtual-core@3.17.9': patches/@tanstack__virtual-core@3.17.9.patch
  '@xterm/addon-image@0.10.0-beta.333': patches/@xterm__addon-image@0.10.0-beta.333.patch
  reka-ui@2.10.4: patches/reka-ui@2.10.4.patch
# Build the patched image addon from its published TypeScript sources.
packageExtensions:
  '@xterm/addon-image@0.10.0-beta.333':
    dependencies:
      sixel: 0.16.0
      xterm-wasm-parts: 0.4.1
